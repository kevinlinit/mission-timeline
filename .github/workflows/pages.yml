# Builds the static site and API (npm run build) and publishes dist/ to the gh-pages branch, and to
# japan-trip-demo, the branch GitHub Pages currently deploys. Either branch can be the Pages source.
# (The old demo is kept on the branch japan-trip-demo-archive.)
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Push dist/ to the Pages branches
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          for branch in gh-pages japan-trip-demo; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "gh-pages:$branch"
          done
