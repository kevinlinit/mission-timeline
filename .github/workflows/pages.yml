# Builds the static site and API (npm run build) and publishes dist/ every way GitHub Pages can take it:
# deployed directly (Pages source "GitHub Actions", recommended), and pushed to the gh-pages and
# japan-trip-demo branches (Pages source "Deploy from a branch").
# (The old demo is kept on the branch japan-trip-demo-archive.)
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
        env:
          # Set in Settings → Secrets and variables → Actions → Variables once the server is running.
          PUBLIC_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}
      - name: Push dist/ to the Pages branches
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          for branch in gh-pages japan-trip-demo; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "gh-pages:$branch"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pages set to "GitHub Actions" (Settings → Pages → Source) serves this deployment. Its
  # github-pages environment must allow the main branch (Settings → Environments → github-pages →
  # Deployment branches and tags), or this job fails with "not allowed to deploy".
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
